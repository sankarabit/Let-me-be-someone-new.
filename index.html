<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Une lettre pour toi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Caveat:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #ead9bd;
    --paper-dark: #d8c29b;
    --char: #2b1a10;
    --ink: #3a2515;
    --ink-soft: #5c4027;
    --wax: #7a1620;
    --wax-dark: #4e0d14;
    --wax-light: #a32433;
    --gold: #b68a4e;
    --bg-dark: #14100c;
  }
  :root:not([data-theme="light"]){ }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; min-height:100%;
    font-family:'Cormorant Garamond', serif;
    background: var(--bg-dark);
    color: var(--ink);
    overflow-x:hidden;
  }
  body{
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  html{ scroll-padding-top: env(safe-area-inset-top,0px); }

  /* ---------- Scene 1 : Envelope ---------- */
  #envelope-screen{
    position:fixed; inset:0; z-index:20;
    display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(circle at 50% 40%, #2a2016 0%, #14100c 70%);
    transition: opacity 1.1s ease, visibility 1.1s ease;
  }
  #envelope-screen.hidden{
    opacity:0; visibility:hidden; pointer-events:none;
  }
  .hint{
    position:absolute; bottom:48px; left:50%; transform:translateX(-50%);
    color:#c9b48c; font-family:'Cormorant Garamond',serif; font-style:italic;
    font-size:15px; letter-spacing:0.03em; opacity:0.75;
    animation: pulse 2.4s ease-in-out infinite;
    text-align:center; width:90%;
  }
  @keyframes pulse{ 0%,100%{opacity:0.4;} 50%{opacity:0.85;} }

  .envelope-wrap{
    position:relative;
    width: min(340px, 82vw);
    aspect-ratio: 3/2;
  }
  .envelope-body{
    position:absolute; inset:0;
    background: linear-gradient(160deg, #cdb382, #b89768 60%, #a7834f);
    border-radius: 4px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.55), inset 0 0 0 1px rgba(255,255,255,0.08);
  }
  .envelope-flap{
    position:absolute; top:0; left:0; width:100%; height:62%;
    background: linear-gradient(160deg, #e1caa0, #c8a877);
    clip-path: polygon(0 0, 100% 0, 50% 85%);
    transform-origin: top center;
    transition: transform 1.1s cubic-bezier(.6,-0.1,.2,1.3);
    box-shadow: inset 0 -2px 6px rgba(0,0,0,0.12);
    z-index:3;
  }
  .envelope-flap.open{
    transform: rotateX(178deg);
  }
  .envelope-shadow-lines{
    position:absolute; inset:0;
    clip-path: polygon(0 100%, 50% 42%, 100% 100%);
    background: linear-gradient(0deg, rgba(0,0,0,0.12), transparent 60%);
    z-index:2;
  }
  .seal{
    position:absolute;
    top:50%; left:50%;
    width:78px; height:78px;
    transform: translate(-50%,-50%);
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, var(--wax-light), var(--wax) 55%, var(--wax-dark) 100%);
    box-shadow: 0 6px 14px rgba(0,0,0,0.45), inset 0 2px 4px rgba(255,255,255,0.25), inset 0 -4px 8px rgba(0,0,0,0.4);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    z-index:5;
    transition: transform 0.25s ease;
  }
  .seal:hover{ transform: translate(-50%,-50%) scale(1.04); }
  .seal:active{ transform: translate(-50%,-50%) scale(0.96); }
  .seal span{
    font-family:'Playfair Display', serif;
    font-weight:600;
    font-size:30px;
    color: #e9d3b0;
    text-shadow: 0 1px 1px rgba(0,0,0,0.5);
  }
  .seal.cracked{
    animation: crackShake 0.4s ease;
  }
  @keyframes crackShake{
    0%,100%{ transform:translate(-50%,-50%) rotate(0deg); }
    25%{ transform:translate(-51%,-50%) rotate(-2deg); }
    75%{ transform:translate(-49%,-50%) rotate(2deg); }
  }
  .seal svg.crack{
    position:absolute; inset:0; width:100%; height:100%;
    opacity:0; pointer-events:none;
  }
  .seal.cracked svg.crack{ opacity:1; }
  .seal.cracked svg.crack path{
    stroke-dasharray: 60; stroke-dashoffset:60;
    animation: drawCrack 0.35s ease forwards;
  }
  @keyframes drawCrack{ to{ stroke-dashoffset:0; } }

  .seal-half{
    position:absolute; top:50%; left:50%; width:78px; height:78px;
    transform: translate(-50%,-50%);
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, var(--wax-light), var(--wax) 55%, var(--wax-dark) 100%);
    z-index:6; opacity:0; pointer-events:none;
  }
  .seal-half.fly{
    opacity:1;
    clip-path: polygon(0 0, 50% 0, 50% 100%, 0 100%);
    animation: flyLeft 0.7s ease forwards;
  }
  .seal-half.fly.right{
    clip-path: polygon(50% 0, 100% 0, 100% 100%, 50% 100%);
    animation: flyRight 0.7s ease forwards;
  }
  @keyframes flyLeft{
    to{ transform: translate(-130%,-30%) rotate(-50deg); opacity:0; }
  }
  @keyframes flyRight{
    to{ transform: translate(30%,-30%) rotate(50deg); opacity:0; }
  }

  /* ---------- Scene 2 : Letter ---------- */
  #letter-screen{
    position:relative; z-index:10;
    min-height:100vh;
    display:flex; justify-content:center;
    padding: 80px 20px 140px;
    background:
      radial-gradient(ellipse at 50% 0%, #241c14 0%, #14100c 55%);
  }
  .paper{
    position:relative;
    width:min(620px, 100%);
    background:
      radial-gradient(ellipse at 20% 10%, rgba(255,255,255,0.10), transparent 45%),
      radial-gradient(ellipse at 85% 95%, rgba(0,0,0,0.18), transparent 50%),
      linear-gradient(170deg, var(--paper), var(--paper-dark));
    border-radius: 3px;
    padding: 56px 40px 70px;
    box-shadow: 0 30px 70px rgba(0,0,0,0.55);
    opacity:0; transform: translateY(40px) scale(0.97);
    transition: opacity 1s ease, transform 1s ease;
  }
  .paper.show{ opacity:1; transform: translateY(0) scale(1); }
  .paper::before{
    content:"";
    position:absolute; inset:0;
    background: repeating-linear-gradient(0deg, rgba(90,60,30,0.025) 0px, rgba(90,60,30,0.025) 1px, transparent 1px, transparent 3px);
    pointer-events:none;
    border-radius:3px;
  }
  .paper::after{
    content:"";
    position:absolute; inset:0;
    box-shadow:
      inset 0 0 40px rgba(60,35,10,0.35),
      inset 0 0 90px rgba(30,15,5,0.25);
    pointer-events:none;
    border-radius:3px;
  }
  .letter-heading{
    font-family:'Caveat', cursive;
    font-size:26px;
    color: var(--ink-soft);
    text-align:right;
    margin:0 0 30px;
    position:relative; z-index:1;
  }
  .line{
    font-family:'Caveat', cursive;
    font-size: 25px;
    line-height:1.55;
    color: var(--char);
    margin: 0 0 6px;
    opacity:0;
    transform: translateY(14px);
    transition: opacity 0.75s ease, transform 0.75s ease;
    position:relative; z-index:1;
  }
  .line.visible{ opacity:1; transform:translateY(0); }
  .line.blank{ height:14px; margin:0; }
  .signature{
    font-family:'Caveat', cursive;
    font-size:30px;
    color: var(--ink-soft);
    margin-top:28px;
    text-align:right;
    opacity:0; transform:translateY(14px);
    transition: opacity 0.9s ease, transform 0.9s ease;
    position:relative; z-index:1;
  }
  .signature.visible{ opacity:1; transform:translateY(0); }

  .flourish{
    text-align:center; margin-top:40px;
    color: var(--gold); font-size:22px;
    opacity:0; transition: opacity 1.2s ease;
    position:relative; z-index:1;
  }
  .flourish.visible{ opacity:0.85; }
</style>
</head>
<body>

<!-- SCENE 1: ENVELOPE -->
<div id="envelope-screen">
  <div class="envelope-wrap">
    <div class="envelope-body"></div>
    <div class="envelope-shadow-lines"></div>
    <div class="envelope-flap" id="flap"></div>
    <div class="seal" id="seal">
      <span>H</span>
      <svg class="crack" viewBox="0 0 78 78">
        <path d="M39 10 L34 30 L44 36 L30 50 L39 68" fill="none" stroke="#2a0509" stroke-width="1.6"/>
        <path d="M34 30 L20 34" fill="none" stroke="#2a0509" stroke-width="1.4"/>
        <path d="M44 36 L60 32" fill="none" stroke="#2a0509" stroke-width="1.4"/>
      </svg>
    </div>
    <div class="seal-half" id="sealLeft"></div>
    <div class="seal-half" id="sealRight"></div>
  </div>
  <div class="hint" id="hint">touche le sceau pour l'ouvrir</div>
</div>

<!-- SCENE 2: LETTER -->
<div id="letter-screen">
  <div class="paper" id="paper">
    <p class="letter-heading">Pour Hermila</p>
    <div id="letter-body"></div>
    <div class="flourish" id="flourish">❦</div>
  </div>
</div>

<script>
  const letterText = [
    "À toi,", "",
    "Il y a des choses que je n'ai jamais vraiment su te dire correctement.",
    "Avec le temps, j'ai beaucoup repensé à nous. À ce qu'on était, à ce qu'on avait construit, à tous ces moments où on s'aimait simplement, sans avoir besoin de se demander si ça allait durer.", "",
    "Et puis il y a eu ton départ.",
    "Tu partais pour tes études, et au lieu de voir tout ce qu'on pouvait encore construire malgré la distance, j'ai commencé à voir tout ce qui pouvait mal tourner.", "",
    "J'ai eu peur.",
    "Peur de la distance.",
    "Peur de ne plus savoir où j'en étais.",
    "Peur des problèmes de confiance.",
    "Peur de souffrir.",
    "Peur de perdre quelque chose qui comptait énormément pour moi.", "",
    "Et dans toutes ces peurs, j'ai pris une décision.",
    "J'ai décidé de nous arrêter avant même de savoir si nous aurions réellement échoué.", "",
    "Aujourd'hui, je comprends que je t'ai fait porter le poids d'une décision qui venait surtout de mes propres peurs.",
    "Et je suis désolé.",
    "Pas seulement parce que je t'ai perdue, mais parce que je sais que je t'ai probablement donné l'impression que notre histoire était plus facile à abandonner qu'elle ne l'était réellement.", "",
    "La vérité, c'est que je t'aimais.",
    "Et une partie de moi t'aime encore.", "",
    "Je ne te dis pas ça pour effacer ce que j'ai fait. Je sais qu'un « je suis désolé » ne peut pas réparer à lui seul ce que j'ai pu provoquer en toi.", "",
    "Je ne sais pas non plus ce que tu ressens aujourd'hui.",
    "Peut-être que tu m'en veux encore.",
    "Peut-être que tu as réussi à tourner la page.",
    "Peut-être qu'une partie de toi se demande encore pourquoi j'ai fait ça.",
    "Et je comprendrais chacune de ces choses.", "",
    "Mais il y a quelque chose que je voulais enfin avoir le courage de te dire :",
    "si je pouvais revenir à ce moment-là, je ne laisserais pas mes peurs décider à ma place.",
    "Je ne te promettrais pas que tout aurait été parfait.",
    "Je te promettrais simplement qu'on aurait essayé.",
    "Qu'on aurait parlé quand ça aurait été difficile.",
    "Qu'on aurait affronté les doutes ensemble.",
    "Qu'on aurait laissé notre histoire nous montrer ce qu'elle pouvait devenir, au lieu de décider à l'avance qu'elle finirait mal.", "",
    "Aujourd'hui, je ne viens pas te demander de revenir avec moi.",
    "Je ne veux pas te mettre cette pression.",
    "J'aimerais simplement avoir la possibilité de revenir, doucement, dans ta vie.",
    "Recommencer par une conversation.",
    "Puis peut-être une autre.",
    "Et si, quelque part, il reste encore une petite place pour moi, j'aimerais pouvoir te montrer que je ne suis plus celui qui a laissé la peur choisir pour lui.", "",
    "Je ne sais pas ce que tu décideras après avoir lu tout ça.",
    "Mais cette fois, contrairement à l'époque, je veux accepter ton choix au lieu d'essayer de décider à ta place.", "",
    "Je voulais juste que tu saches une chose :",
    "je regrette de nous avoir abandonnés au moment où j'avais surtout besoin de croire en nous.",
    "Et malgré tout ce qui s'est passé, je suis reconnaissant d'avoir connu cette histoire avec toi.", "",
    "Si un jour tu as envie de me reparler, je serai là.",
    "Sans pression.",
    "Juste avec l'envie sincère de te retrouver."
  ];

  const body = document.getElementById('letter-body');
  letterText.forEach(function(t){
    const p = document.createElement('p');
    if(t === ""){
      p.className = "line blank";
    } else {
      p.className = "line";
      p.textContent = t;
    }
    body.appendChild(p);
  });

  const sig = document.createElement('p');
  sig.className = "signature";
  sig.textContent = "— Teddy";
  document.querySelector('.paper').insertBefore(sig, document.getElementById('flourish'));

  // Seal click -> crack -> open envelope -> reveal letter screen
  const seal = document.getElementById('seal');
  const flap = document.getElementById('flap');
  const envelopeScreen = document.getElementById('envelope-screen');
  const hint = document.getElementById('hint');
  const sealLeft = document.getElementById('sealLeft');
  const sealRight = document.getElementById('sealRight');
  const paper = document.getElementById('paper');
  let opened = false;

  seal.addEventListener('click', function(){
    if(opened) return;
    opened = true;
    hint.style.opacity = '0';
    seal.classList.add('cracked');

    setTimeout(function(){
      sealLeft.classList.add('fly');
      sealRight.classList.add('fly', 'right');
      seal.style.opacity = '0';
      flap.classList.add('open');
    }, 420);

    setTimeout(function(){
      envelopeScreen.classList.add('hidden');
      document.body.style.overflow = 'auto';
      window.scrollTo({top:0, behavior:'instant'});
      setTimeout(function(){ paper.classList.add('show'); }, 250);
    }, 1500);
  });

  // Scroll-reveal for each line
  const lines = document.querySelectorAll('.line, .signature');
  const observer = new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if(entry.isIntersecting){
        entry.target.classList.add('visible');
      }
    });
  }, { threshold: 0.4, rootMargin: "0px 0px -8% 0px" });
  lines.forEach(function(l){ observer.observe(l); });

  const flourishObserver = new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if(entry.isIntersecting){ entry.target.classList.add('visible'); }
    });
  }, { threshold: 0.6 });
  flourishObserver.observe(document.getElementById('flourish'));

  document.body.style.overflow = 'hidden';
</script>

</body>
</html>
